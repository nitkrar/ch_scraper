[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ch-bulk"
version = "0.1.0"
description = "Download and query UK Companies House bulk data by SIC code"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
keywords = ["companies-house", "uk", "sic-code", "bulk-data", "duckdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "duckdb>=1.0",
    "ixbrlparse>=0.11.2",
    "odfpy>=1.4.1",
    "pandas>=2.2",
    "pdfplumber>=0.11.9",
    "rapidfuzz>=3.6",
    "requests>=2.32",
    "rich>=13.0",
    "trafilatura>=1.9",
    "typer>=0.12",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.54",
]

[project.urls]
Homepage = "https://github.com/nitkrar/ch_scraper"
Issues = "https://github.com/nitkrar/ch_scraper/issues"

[project.scripts]
ch-bulk = "ch_bulk.cli:app"

[tool.setuptools.packages.find]
include = ["ch_bulk*"]
