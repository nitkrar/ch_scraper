name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check tag matches pyproject version
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${{ github.ref_name }}" != "v${VERSION}" ]; then
            echo "ERROR: tag ${{ github.ref_name }} does not match pyproject version ${VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: |
          pip install -e .
          # Ensure Tkinter is available for PyInstaller to bundle
          python -c "import tkinter" || { echo "ERROR: Tkinter not available"; exit 1; }
          pip install pyinstaller

      - name: Build .app
        run: pyinstaller ch_bulk.spec --noconfirm

      - name: Sign .app (ad-hoc)
        run: codesign --force --deep --sign - "dist/CH Bulk.app"

      - name: Create DMG
        run: |
          hdiutil create -volname "CH Bulk" \
            -srcfolder "dist/CH Bulk.app" \
            -ov -format UDZO \
            "dist/CH-Bulk-${{ github.ref_name }}-mac.dmg"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CH-Bulk-*.dmg
