name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    # macOS because the app is mac-only and setup-python's macOS builds ship
    # Tk, which tests need: they import ch_bulk.gui (and so tkinter).
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          python -c "import tkinter"

      - name: Run tests
        run: python -m pytest -q
